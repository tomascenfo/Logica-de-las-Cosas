<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>La lógica de las cosas</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      color: #222;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(700px, 90%);
      text-align: center;
    }

    h1 {
      margin-bottom: 0.4rem;
      font-size: clamp(2.5rem, 7vw, 5rem);
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0.5rem 0;
      color: #555;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .estado {
      margin-top: 3rem;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #888;
    }
  </style>
</head>

<body>

  <main>
    <h1>La lógica de las cosas</h1>

    <p>
      Ideas, modelos y experimentos para entender cómo funciona el mundo.
    </p>

    <div class="estado">
      En desarrollo
    </div>
  </main>

</html>
